<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070c">
<title>Stats Castellar · Capa 7 · Funcional</title>
<link rel="stylesheet" href="css/capa7.css?v=7.0.5">
</head>
<body>
<div class="safe-shell">
 <div class="prototype">
  <header class="header">
   <button class="zone action" id="actionBox" type="button" disabled><span class="header-title">ACCIÓ ACTUAL</span><strong class="action-value" id="actionValue">RECEPCIÓ</strong></button>
   <div class="zone score-zone" id="ownScoreZone"><div class="team-identity"><img class="team-crest" src="assets/escut-club.png" alt="Escut del Castellar"><span class="header-title">CASTELLAR</span></div><div class="score-row"><button class="score-adjust" data-score-team="home" data-delta="-1">−</button><strong id="scoreHome">0</strong><button class="score-adjust" data-score-team="home" data-delta="1">+</button></div></div>
   <div class="zone set-zone"><span class="header-title">SET</span><strong class="set-number" id="setNumber">1</strong><div class="set-dots" id="setDots" aria-label="5 sets"></div></div>
   <div class="zone score-zone" id="rivalScoreZone"><div class="team-identity"><span class="rival-crest-slot" aria-hidden="true"></span><span class="header-title rival-name" id="rivalName">SANT CUGAT</span></div><div class="score-row"><button class="score-adjust" data-score-team="away" data-delta="-1">−</button><strong id="scoreAway">0</strong><button class="score-adjust" data-score-team="away" data-delta="1">+</button></div></div>
   <button class="zone undo" id="undoBtn" type="button"><span class="round-icon" aria-hidden="true">↺</span><span class="header-title">DESFER</span><small id="undoLabel"></small></button>
  </header>

  <main class="arena">
   <div class="scene" aria-hidden="true"></div>
   <button class="rival-touch-zone" id="rivalCourtBtn" type="button" aria-label="Camp rival"></button>
   <div class="rival-label"><strong>CAMP RIVAL</strong><span>↻ Toca si la pilota passa directament al rival</span></div>

   <div class="block-grid" id="blockGrid" aria-label="Controls de bloqueig"></div>
   <div class="player-grid" id="playerGrid" aria-label="Sis jugadores a pista"></div>
  </main>

  <footer class="footer">
   <button class="foot" id="homeBtn"><span class="foot-icon">⌂</span><span>INICI</span></button>
   <button class="foot sos" id="sosBtn"><strong><span class="sos-icon" aria-label="SOS">SOS</span></strong></button>
   <div class="foot info">INFANTIL FEMENÍ A · 2a DIV. · 2026–27 · C7 7.0.5 · ESCUT PROVA <label class="venue-test">PROVA: <select id="venueTest" aria-label="Condició de local o visitant"><option value="local">LOCAL</option><option value="visitant">VISITANT</option></select></label></div>
   <button class="foot" id="positionsBtn"><span class="foot-icon positions-icon">✥</span><span>POSICIONS</span></button>
   <button class="foot" id="changeBtn"><span class="foot-icon change">⇄</span><span>CANVI JUG.</span></button>
   <button class="foot" id="finishSetBtn"><span class="foot-icon flag">⚑</span><span>FINALITZAR SET</span></button>
   <button class="foot finish" id="finishMatchBtn"><span>FINALITZAR PARTIT</span></button>
  </footer>
 </div>
</div>

<div class="modal-layer" id="modalLayer" hidden>
 <div class="modal" role="dialog" aria-modal="true">
  <h2 id="modalTitle"></h2>
  <div id="modalBody"></div>
  <div class="modal-actions" id="modalActions"></div>
 </div>
</div>

<script src="js/capa7.js?v=7.0.5"></script>
</body>
</html>
