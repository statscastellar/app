name: iPhone XR isolated regression
on:
  push:
    branches:
      - fix/iphone-xr-layout-and-match-close-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run test:z1
  mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium e2e/iphone-xr-finalization.spec.cjs e2e/flows.spec.cjs e2e/match-footer.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iphone-xr-test-failures
          path: tests/reports/
