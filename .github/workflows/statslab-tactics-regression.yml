name: StatsLab tactics isolated regression
on:
  push:
    branches:
      - statslab/tactiques-z1-6-2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: node tests/tactics-z1-6-2.test.js
      - run: npm ci --ignore-scripts
        working-directory: tests
      - run: node --require ./fixtures/clock.cjs --test --test-isolation=none unit/final-result.test.cjs unit/player-order.test.cjs unit/recover-active.test.cjs unit/supplemental.test.cjs
        working-directory: tests
      - run: npm run test:z1
        working-directory: tests
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: echo "QA_CHROMIUM=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - run: npx playwright test --project=desktop-chromium --grep-invert @visual
      - run: npx playwright test e2e/tactics-6-2.spec.cjs --project=iphone-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: statslab-tactics-failures
          path: tests/reports/
