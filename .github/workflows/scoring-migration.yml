name: Scoring migration validation
on:
  push:
    branches: ['dev/ponderacio-1.3.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check shared/pro2-core.bundle.js
      - run: node --require ./tests/fixtures/audit-clock.cjs tests/audit/scoring-migration-130.test.js
      - run: npm --prefix tests run test:audit
